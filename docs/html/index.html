<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>unnamed API Documentation</title>
<style>
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; display: flex; height: 100vh; }
nav { width: 280px; background: #1e293b; padding: 24px 16px; border-right: 1px solid #334155; overflow-y: auto; }
main { flex: 1; padding: 40px 48px; overflow-y: auto; }
h1, h2, h3 { color: #f8fafc; }
.search-box { width: 100%; padding: 10px 12px; background: #0f172a; border: 1px solid #475569; border-radius: 6px; color: #fff; margin-bottom: 20px; box-sizing: border-box; }
.card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; text-transform: uppercase; background: #3b82f6; color: #fff; margin-right: 8px; }
code { background: #334155; padding: 2px 6px; border-radius: 4px; font-family: monospace; color: #38bdf8; }
</style>
</head>
<body>
<nav>
<h2>unnamed <span style="font-size:14px;color:#94a3b8;">v0.1.0</span></h2>
<input type="text" class="search-box" id="search" placeholder="Search documentation..." onkeyup="filterDocs()">
<div id="nav-list">
</div>
</nav>
<main id="content">
<h1>unnamed API Reference</h1>
<p style="color:#94a3b8;">A Zenlang application</p>
<hr style="border:0;border-top:1px solid #334155;margin:24px 0;">
</main>
<script>
function filterDocs() {
  var val = document.getElementById('search').value.toLowerCase();
  var entries = document.querySelectorAll('.doc-entry');
  entries.forEach(function(el) { el.style.display = el.innerText.toLowerCase().indexOf(val) > -1 ? 'block' : 'none'; });
}
</script>
</body>
</html>
